<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>deemon</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2&display=swap');

      :root {
        color-scheme: light dark;
      }

      body {
        font-family: 'Baloo Tammudu 2', sans-serif;
        background-color: #c0c0c0 !important;
        color: #404040 !important;
        margin: 0;
      }

      a {
        text-decoration: none;
        color: #2f7a40 !important;
      }

      a:hover {
        text-decoration: underline;
      }

      .container {
        position: relative;
        font-family: sans-serif;
        background-color: #f0f0f0 !important;
        color: #404040 !important;
      }

      .album.container {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: flex-start;
        width: 100%;
      }

      .album {
        width: 100%;
        background-color: #f0f0f0 !important;
        color: #404040 !important;
        box-sizing: border-box;
        padding: 10px;
      }

      .album.header {
        border-top-left-radius: 17px;
        border-top-right-radius: 17px;
        background-color: #f0f0f0 !important;
        height: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #6106e5 !important;
        padding-top: 35px;
        font-family: 'Baloo Tammudu 2', sans-serif;
        font-weight: bold;
        font-size: 2.5em;
      }

      .album.updates {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #70af71 !important;
        font-family: sans-serif;
        font-size: 1em;
        color: #ffffff !important;
        margin-bottom: 20px;
      }

      .album.new-release-banner {
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.25em;
        margin-bottom: -10px;
        color: #404040 !important;
        background-color: #f0f0f0 !important;
      }

      .album.body {
        flex: 0 0 25%;
        min-width: 350px;
        max-width: 100%;
        box-sizing: border-box;
        color: #404040 !important;
        background-color: #f0f0f0 !important;
        padding: 0 10px 0 10px;
        font-size: 0.9em;
        display: block;
        overflow: hidden;
        margin: 0 0 30px 0;
      }

      .album.date {
        flex: 0 0 100%;
        width: 100%;
        margin-top: 40px;
        margin-bottom: 30px;
        color: #6106e5 !important;
        background-color: #f0f0f0 !important;
      }

      .album.date.badge {
        color: #6106e5 !important;
        background: none !important;
        border-radius: 7px;
        border: 1px solid #6106e5 !important;
        text-shadow: none;
        font-size: 1em;
        font-family: sans-serif;
      }

      .album.subheader {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .footerarea {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 50px;
        color: #606060 !important;
      }

      .album.support {
        font-size: 0.8em;
        line-height: 1em;
        color: #606060 !important;
        background-color: #f0f0f0 !important;
      }

      .album.footer {
        border-bottom-left-radius: 7px;
        border-bottom-right-radius: 7px;
        font-family: monospace;
        font-size: 0.60em;
        background-color: #e0e0e0 !important;
        color: #606060 !important;
      }

      .albumtitle {
        margin-top: 5px;
        font-weight: bold;
        color: #404040 !important;
      }

      .artistname {
        font-style: italic;
        padding-bottom: 10px;
        color: #404040 !important;
      }

      .albuminfo {
        vertical-align: top;
        color: #404040 !important;
      }

      .albuminfo a {
        color: #2f7a40 !important;
      }

      .album-row {
        width: 100%;
        border-collapse: collapse;
        border-spacing: 0;
      }

      .albumart {
        width: 150px;
        max-width: 150px;
        height: 150px;
        max-height: 150px;
        vertical-align: top;
        padding: 0 20px 0 0;
        overflow: hidden;
      }

      .albumart a {
        display: block;
        width: 150px;
        height: 150px;
        overflow: hidden;
        line-height: 0;
        text-decoration: none;
      }

      .albumart img {
        border-radius: 7px;
        filter: drop-shadow(0.1rem 0.1rem 0.2rem #808080);
        width: 150px !important;
        height: 150px !important;
        max-width: 150px !important;
        max-height: 150px !important;
        display: block;
        border: 0;
        object-fit: cover;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #121212 !important;
          color: #f0f0f0 !important;
        }

        .container,
        .album,
        .album.header,
        .album.new-release-banner,
        .album.body,
        .album.date,
        .album.support {
          background-color: #1e1e1e !important;
          color: #f0f0f0 !important;
        }

        .album.header {
          color: #b794f6 !important;
        }

        .album.new-release-banner,
        .album.title,
        .albumtitle,
        .artistname,
        .albuminfo {
          color: #f0f0f0 !important;
        }

        .album.date.badge {
          color: #b794f6 !important;
          border-color: #b794f6 !important;
        }

        .album.footer {
          background-color: #2a2a2a !important;
          color: #c0c0c0 !important;
        }

        .footerarea {
          color: #c0c0c0 !important;
        }

        a,
        .albuminfo a {
          color: #8fd49a !important;
        }

        .albumart img {
          filter: drop-shadow(0.1rem 0.1rem 0.2rem #000000);
        }
      }
    </style>
  </head>
  <body style="margin:0; background-color:#c0c0c0; color:#404040;">
	<div class="container" style="background-color:#f0f0f0; color:#404040;">
		<div class="album header" style="background-color:#f0f0f0; color:#6106e5;">
			deemon
		</div>
		<div class="album updates" style="background-color:#70af71; color:#ffffff; {VIEW_UPDATE_MESSAGE}">
			{UPDATE_MESSAGE}
		</div>
		<div class="album new-release-banner" style="background-color:#f0f0f0; color:#404040;">
			{NEW_RELEASE_COUNT} new release(s) were found!
		</div>
		<!---- START ALBUM LIST HERE ---->
		<div class="album container" style="background-color:#f0f0f0; color:#404040;">
			{NEW_RELEASE_LIST}
		</div>
		<!---- END ALBUM LIST HERE ---->
		<div class="album support footerarea" style="background-color:#f0f0f0; color:#606060;">
			<span style="white-space: pre-line;">
				Open an issue on <a href="{GITHUB_REPO_URL}" style="color:#2f7a40;">GitHub</a> or join us on <a href="https://discord.gg/KzNCG2tkvn" style="color:#2f7a40;">Discord</a>
			</span>
		</div>
		<div class="album footer footerarea" style="background-color:#e0e0e0; color:#606060;">
			{DEEMON_VER} | {PY_VER} | {SYS_VER}
		</div>
	</div>
  </body>
</html>
